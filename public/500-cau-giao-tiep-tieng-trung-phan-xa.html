    const CAT_NAMES = {
      greeting: 'Chào hỏi & Xã giao',
      dining: 'Ăn uống & Gọi món',
      shopping: 'Mua sắm & Mặc cả',
      travel: 'Hỏi đường & Giao thông',
      hotel: 'Khách sạn & Lưu trú',
      work: 'Công sở & Đối tác',
      health: 'Y tế & Sức khỏe',
      emergency: 'Tình huống khẩn cấp',
      emotion: 'Cảm xúc & Ứng xử',
      daily: 'Đời sống thường nhật'
    };

    let currentCategory = 'all';

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPhrases();
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-CN';
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
      }
    }

    function renderPhrases() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const list = document.getElementById('phrasesList');
      list.innerHTML = '';

      const filtered = PHRASES.filter(p => {
        const matchesCat = currentCategory === 'all' || p.cat === currentCategory;
        const matchesSearch = !q || p.cn.includes(q) || p.py.toLowerCase().includes(q) || p.vi.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      document.getElementById('counterDisplay').textContent = `Đang hiển thị: ${filtered.length} / 500 câu`;

      if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align: center; padding: 40px; color: #94A3B8;">Không tìm thấy câu phù hợp với từ khóa tìm kiếm.</div>';
        return;
      }

      const fragment = document.createDocumentFragment();
      filtered.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'phrase-card';
        card.innerHTML = `
          <div class="phrase-content">
            <div>
              <span class="phrase-index">#${idx + 1}</span>
              <span class="phrase-category">${CAT_NAMES[p.cat] || p.cat}</span>
            </div>
            <div class="phrase-cn">${p.cn}</div>
            <div class="phrase-pinyin">${p.py}</div>
            <div class="phrase-vi">${p.vi}</div>
          </div>
          <button class="audio-btn" onclick="speak('${p.cn.replace(/'/g, "\\'")}')">🔊 Nghe</button>
        `;
        fragment.appendChild(card);
      });
      list.appendChild(fragment);
    }

    renderPhrases();
  </script>
